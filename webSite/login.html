<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password }) // Sende die Daten als JSON
            });

            if (response.ok) {
                window.location.href = '/main.html'; // Weiterleitung zur main.html
            } else {
                const result = await response.json();
                alert(result.message);
            }
        }
    </script>
</head>

<body>
    <main class="container login-main">
        <section class="glass-card login-card">
            <h2>Willkommen</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="username" name="username" class="modern-input" required placeholder=" "
                        autocomplete="username">
                    <label for="username" class="floating-label">Benutzername</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="modern-input" required placeholder=" "
                        autocomplete="current-password">
                    <label for="password" class="floating-label">Passwort</label>
                </div>
                <button type="submit" class="btn">Anmelden</button>
            </form>
        </section>
    </main>
</body>

</html>
