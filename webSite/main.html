<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeViewServer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="app-shell">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-bar__brand">
      <span class="top-bar__logo">NodeViewServer</span>
      <div class="top-bar__version">
        <span id="server-version">lädt …</span>
        <span id="update-badge" class="update-badge">⏳</span>
      </div>
    </div>
  </header>

  <!-- UPDATE BANNER (nur sichtbar wenn Update verfügbar) -->
  <div id="update-banner" class="update-banner">
    <p id="update-details" class="update-banner__message"></p>
    <button id="btn-update-server" class="btn-update" type="button">
      ↑ Aktualisieren
    </button>
  </div>

  <!-- MAIN LAYOUT: Sidebar + Content -->
  <div class="main-layout">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar" aria-label="Bereiche">
      <div class="sidebar__label">Bereiche</div>
      <!-- Dynamisch befüllt durch script.js -->
    </nav>

    <!-- CONTENT -->
    <div class="content">

      <!-- Breadcrumb -->
      <div class="content__header">
        <nav class="breadcrumb" id="breadcrumb" aria-label="Pfad"></nav>
      </div>

      <!-- Dateiliste -->
      <div class="file-list" id="file-list">
        <!-- Dynamisch befüllt durch script.js -->
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <form id="logoutForm" action="/logout" method="POST">
      <button type="submit" class="btn-logout">Abmelden</button>
    </form>
    <span>&copy; NodeViewServer</span>
  </footer>

</body>

</html>
