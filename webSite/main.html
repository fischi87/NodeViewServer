<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHome24</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 class="fancy-heading">MyHome24 Datenserver</h1>
    </header>
    <div class="container">
        <div id="directories" class="directory-list">
            <!-- Dynamisch geladene Verzeichnisse erscheinen hier -->
        </div>
        <div class="logout-container">
            <form id="logoutForm" action="/logout" method="POST">
                <button type="submit">Abmelden</button>
            </form>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2024 MyHome24-Browser</p>
    </footer>
</body>
</html>
