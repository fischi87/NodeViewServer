<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeViewServer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 class="fancy-heading">NodeViewServer</h1>
        <div id="update-info">
            <span id="server-version">Version wird geladen...</span>
            <button id="btn-update-server" style="margin-left: 10px;">
                Server-Update ausführen
            </button>
        </div>
    </header>
    <div class="container">
        <div id="directories" class="directory-list">
            <!-- Dynamisch geladene Verzeichnisse erscheinen hier -->
        </div>
        <div class="logout-container">
            <form id="logoutForm" action="/logout" method="POST">
                <button type="submit">Abmelden</button>
            </form>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; NodeViewServer</p>
    </footer>
</body>
</html>
