<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeViewServer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1 class="fancy-heading">NodeViewServer</h1>

        <!-- Version + Update-Button in einer Zeile / Box -->
        <div id="update-info" class="update-info">
            <span id="server-version">Server-Version wird geladen...</span>
            <button id="btn-update-server" type="button" class="update-button">
                Server-Update ausführen
            </button>
        </div>
    </header>

    <main class="container">
        <div id="directories" class="directory-list">
            <!-- Dynamisch geladene Verzeichnisse erscheinen hier -->
        </div>

        <div class="logout-container">
            <form id="logoutForm" action="/logout" method="POST">
                <button type="submit" class="logout-button">Abmelden</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; NodeViewServer</p>
    </footer>
</body>
</html>
