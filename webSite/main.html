<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeViewServer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="app-shell">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-bar__brand">
      <span class="top-bar__logo">NodeViewServer</span>
      <div class="top-bar__version">
        <span id="server-version">lädt …</span>
        <span id="update-badge" class="update-badge">⏳</span>
      </div>
    </div>
    <div class="top-bar__actions">
      <button id="btn-favorites" class="top-bar__btn-favorites" aria-label="Favoriten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </button>
      <button id="btn-settings" class="top-bar__btn-settings" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <form id="logoutForm" action="/logout" method="POST">
        <button type="submit" class="btn-logout">Abmelden</button>
      </form>
    </div>
  </header>

  <!-- UPDATE BANNER (nur sichtbar wenn Update verfügbar) -->
  <div id="update-banner" class="update-banner">
    <p id="update-details" class="update-banner__message"></p>
    <button id="btn-update-server" class="btn-update" type="button">
      ↑ Aktualisieren
    </button>
  </div>

  <!-- MAIN LAYOUT: Sidebar + Content -->
  <div class="main-layout">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar" aria-label="Bereiche">
      <div class="sidebar__label">Bereiche</div>
      <!-- Dynamisch befüllt durch script.js -->
    </nav>

    <!-- CONTENT -->
    <div class="content">

      <!-- Breadcrumb -->
      <div class="content__header">
        <nav class="breadcrumb" id="breadcrumb" aria-label="Pfad"></nav>
      </div>

      <!-- Dateiliste -->
      <div class="file-list" id="file-list">
        <!-- Dynamisch befüllt durch script.js -->
      </div>

    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-overlay" class="settings-overlay" role="dialog" aria-modal="true" aria-label="Einstellungen">
    <div class="settings-modal">

      <div class="settings-modal__header">
        <span class="settings-modal__title">Einstellungen</span>
        <button id="settings-close" class="preview-modal__btn-close" aria-label="Schließen">✕</button>
      </div>

      <div class="settings-modal__body">

        <!-- Pfade-Liste -->
        <div class="settings-section__label">Freigegebene Pfade</div>
        <div id="settings-paths-list" class="settings-paths-list">
          <!-- Dynamisch befüllt -->
        </div>

        <!-- Neuen Pfad hinzufügen -->
        <div class="settings-section__label" style="margin-top:1.5rem">Pfad hinzufügen</div>
        <div class="settings-add-form">
          <input id="settings-new-name" class="form-input" type="text" placeholder="Name (z.B. Kamera)">
          <input id="settings-new-path" class="form-input" type="text" placeholder="Pfad (z.B. /mnt/kamera)">
          <button id="settings-add-btn" class="settings-add-btn" type="button">+ Hinzufügen</button>
        </div>

        <!-- Fehlermeldungen -->
        <div id="settings-errors" class="settings-errors"></div>

      </div>

      <div class="settings-modal__footer">
        <button id="settings-cancel" class="btn-logout">Abbrechen</button>
        <button id="settings-save" class="btn-primary settings-save-btn" type="button">Speichern</button>
      </div>

    </div>
  </div>

  <!-- FILE PREVIEW MODAL -->
  <div id="preview-overlay" class="preview-overlay" role="dialog" aria-modal="true" aria-label="Dateivorschau">
    <div class="preview-modal">
      <div class="preview-modal__header">
        <span id="preview-filename" class="preview-modal__title"></span>
        <div class="preview-modal__actions">
          <a id="preview-download" class="preview-modal__btn-download" target="_blank" rel="noopener">↓ Öffnen</a>
          <button id="preview-close" class="preview-modal__btn-close" aria-label="Schließen">✕</button>
        </div>
      </div>
      <div id="preview-body" class="preview-modal__body"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span>&copy; NodeViewServer</span>
  </footer>

</body>

</html>
