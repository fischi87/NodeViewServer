<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeViewServer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="page-header">
        <h1 class="fancy-heading">NodeViewServer</h1>

        <!-- Version + Status-Badge -->
        <div id="update-info" class="update-info">
            <span id="server-version">lädt …</span>
            <span id="update-badge" class="update-badge">⏳</span>
        </div>

        <!-- Erscheint nur wenn Update verfügbar -->
        <div id="update-banner" class="update-banner" style="display:none;">
            <p id="update-details" class="update-banner__message"></p>
            <button id="btn-update-server" class="btn btn-update" type="button">
                ↑ Jetzt aktualisieren
            </button>
        </div>
    </header>

    <main class="container">

        <!-- Verzeichnisse -->
        <section id="directories">
            <!-- Wird dynamisch aus script.js gefüllt -->
        </section>

        <!-- Logout -->
        <div class="logout-container">
            <form id="logoutForm" action="/logout" method="POST">
                <button class="btn btn-link" type="submit">Abmelden</button>
            </form>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; NodeViewServer</p>
    </footer>
</body>

</html>
