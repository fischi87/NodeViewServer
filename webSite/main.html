<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeViewServer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="page-header">
        <h1 class="fancy-heading">NodeViewServer</h1>

        <div id="update-info" class="update-info">
            <span id="server-version">Version wird geladen...</span>
            <button id="btn-update-server" class="btn btn-link" type="button">
                Server-Update
            </button>
        </div>
        <div id="update-details"
            style="margin-top:6px; text-align:center; font-size:0.9rem; color:var(--text-muted); display:none;">
        </div>
    </header>

    <main class="container">

        <!-- Verzeichnisse -->
        <section id="directories">
            <!-- Wird dynamisch aus script.js gefüllt -->
        </section>

        <!-- Logout unten fixiert -->
        <div class="logout-container">
            <form id="logoutForm" action="/logout" method="POST">
                <button class="btn btn-link" type="submit">Abmelden</button>
            </form>
        </div>

    </main>

    <footer class="footer">
        <p>&copy; NodeViewServer</p>
    </footer>
</body>

</html>
